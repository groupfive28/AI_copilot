services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docverify
      POSTGRES_PASSWORD: docverify
      POSTGRES_DB: docverify
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docverify"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    environment:
      # Override in a root .env file (or the shell) to point at Supabase
      # instead of the local `db` service — no code or compose changes needed.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://docverify:docverify@db:5432/docverify}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db_data:
