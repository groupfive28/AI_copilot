[project]
name = "penta-ai-copilot"
version = "0.1.0"
description = "AI-powered document review and verification system"
authors = [
    { name = "hastingstugume", email = "hastingstugume@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "google-cloud-documentai>=3.15.0",
    "google-cloud-storage>=3.13.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=26.1.0",
    "supabase>=2.31.0",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "penta"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.2",
]
